name: Deploy to EC2

on:
  push:
    branches: [master]
  workflow_dispatch: # Actions 탭에서 수동 실행

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend import check
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -c "import main"

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::warning::EC2_HOST / EC2_SSH_KEY Secrets 가 없어 배포를 건너뜁니다."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/ec2_key -o ServerAliveInterval=30 \
            "$EC2_USER@$EC2_HOST" "bash ~/app/scripts/deploy.sh ${GITHUB_SHA}"
